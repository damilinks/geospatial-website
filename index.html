<!DOCTYPE html>
<!--[if lt IE 7]>      <html class="no-js lt-ie9 lt-ie8 lt-ie7"> <![endif]-->
<!--[if IE 7]>         <html class="no-js lt-ie9 lt-ie8"> <![endif]-->
<!--[if IE 8]>         <html class="no-js lt-ie9"> <![endif]-->
<!--[if gt IE 8]>      <html class="no-js"> <!--<![endif]-->
<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title></title>
        <meta name="description" content="">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="">
    </head>
    <body>
        <div class="container">
            <form class="biodata-form">
                <h1>Biodata Form</h1>
                <div class="form-grid">
                    <div class="field">
                        <label for="fullName">Full Name</label>
                        <input type="text" id="fullName" name="fullName" placeholder="Enter your full name">
                    </div>

                    <div class="field">
                        <label for="dob">Date of Birth</label>
                        <input type="date" id="dob" name="dob">
                    </div>

                    <div class="field">
                        <label for="gender">Gender</label>
                        <select id="gender" name="gender">
                            <option value="">Select gender</option>
                            <option>Male</option>
                            <option>Female</option>
                            <option>Prefer not to say</option>
                        </select>
                    </div>

                    <div class="field">
                        <label for="phone">Phone Number</label>
                        <input type="tel" id="phone" name="phone" placeholder="e.g. +234 812 345 6789">
                    </div>

                    <div class="field">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" name="email" placeholder="name@example.com">
                    </div>

                    <div class="field">
                        <label for="nationality">Nationality</label>
                        <input type="text" id="nationality" name="nationality" placeholder="Nationality">
                    </div>

                    <div class="field">
                        <label for="religion">Religion</label>
                        <input type="text" id="religion" name="religion" placeholder="Religion">
                    </div>

                    <div class="field">
                        <label for="maritalStatus">Marital Status</label>
                        <select id="maritalStatus" name="maritalStatus">
                            <option value="">Select status</option>
                            <option>Single</option>
                            <option>Married</option>
                            <option>Divorced</option>
                            <option>Widowed</option>
                        </select>
                    </div>

                    <div class="field full-width">
                        <label for="address">Home Address</label>
                        <textarea id="address" name="address" rows="3" placeholder="Your residential address"></textarea>
                    </div>

                    <div class="field full-width">
                        <label for="education">Educational Background</label>
                        <textarea id="education" name="education" rows="3" placeholder="List your schools, certificates, and qualifications"></textarea>
                    </div>

                    <div class="field full-width">
                        <label for="hobbies">Hobbies / Interests</label>
                        <textarea id="hobbies" name="hobbies" rows="3" placeholder="What do you enjoy doing?"></textarea>
                    </div>

                    <div class="field full-width">
                        <label for="about">About Me</label>
                        <textarea id="about" name="about" rows="4" placeholder="Briefly describe yourself"></textarea>
                    </div>
                </div>

                <div class="actions">
                    <button type="submit">Submit Biodata</button>
                </div>
            </form>
        </div>
    </body>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #eef4ff, #dfefff);
            color: #1f2937;
        }

        .container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 32px 16px;
        }

        .biodata-form {
            width: min(760px, 100%);
            background: #ffffff;
            border-radius: 18px;
            padding: 30px;
            box-shadow: 0 12px 35px rgba(15, 23, 42, 0.12);
        }

        h1 {
            margin: 0 0 22px;
            text-align: center;
            color: #1d4ed8;
            font-size: 2rem;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(220px, 1fr));
            gap: 18px;
        }

        .field {
            display: flex;
            flex-direction: column;
        }

        .field.full-width {
            grid-column: 1 / -1;
        }

        label {
            font-weight: 600;
            margin-bottom: 8px;
            color: #374151;
        }

        input,
        select,
        textarea,
        button {
            font: inherit;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            background: #f9fafb;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.12);
            background: #fff;
        }

        textarea {
            resize: vertical;
        }

        .actions {
            margin-top: 24px;
            display: flex;
            justify-content: center;
        }

        button {
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 10px;
            padding: 12px 28px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        button:hover {
            background: #1d4ed8;
        }

        @media (max-width: 600px) {
            .form-grid {
                grid-template-columns: 1fr;
            }

            .biodata-form {
                padding: 22px 18px;
            }
        }
    </style>
</html>
